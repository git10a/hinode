name: Deploy HINODE to Cloudflare Workers

# Manual only: production deploys run from a Mac with the HINODE account's wrangler login
# (see docs/cloudflare-migration.md). Re-add the push trigger once CLOUDFLARE_API_TOKEN holds a
# working token for the HINODE account.
on:
  workflow_dispatch:

concurrency:
  group: hinode-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:vinext
      - run: npm run deploy:vinext
        env:
          CLOUDFLARE_ACCOUNT_ID: cd288c7e5f37d2adce330bd0aab52f6f
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
